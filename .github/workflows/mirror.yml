name: Mirror to Paperlight

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Paperlight
        run: |
          git remote add paperlight https://${{ secrets.PAPERLIGHT_TOKEN }}@github.com/paperlight-ai/agentos.git
          git push paperlight HEAD:main --force
