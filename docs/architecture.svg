<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="720" fill="#0f172a"/>
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="bold">AgentOS — 9-Layer Stack</text>
  <text x="500" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Always-free infra, production-grade layers</text>

  <!-- VM1 box -->
  <rect x="40" y="100" width="280" height="200" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="180" y="128" text-anchor="middle" fill="#38bdf8" font-size="15" font-weight="bold">VM 1 — Orchestrator</text>
  <text x="180" y="146" text-anchor="middle" fill="#64748b" font-size="11">Oracle Cloud Always-Free · 1GB + 2GB swap</text>
  <rect x="65" y="165" width="230" height="50" rx="6" fill="#0ea5e9" opacity="0.15" stroke="#0ea5e9"/>
  <text x="180" y="186" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="bold">n8n</text>
  <text x="180" y="202" text-anchor="middle" fill="#94a3b8" font-size="10">Layer 4 — Orchestration</text>
  <text x="180" y="270" text-anchor="middle" fill="#64748b" font-size="10">Visual workflows · 400+ integrations</text>

  <!-- VM2 box -->
  <rect x="360" y="100" width="320" height="380" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="520" y="128" text-anchor="middle" fill="#a78bfa" font-size="15" font-weight="bold">VM 2 — Gateway</text>
  <text x="520" y="146" text-anchor="middle" fill="#64748b" font-size="11">Oracle Cloud Always-Free · 1GB + 2GB swap</text>

  <rect x="385" y="165" width="270" height="44" rx="6" fill="#a78bfa" opacity="0.15" stroke="#a78bfa"/>
  <text x="520" y="183" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="bold">LiteLLM</text>
  <text x="520" y="198" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 3 — Gateway · fallback · budget cap</text>

  <rect x="385" y="220" width="270" height="44" rx="6" fill="#f87171" opacity="0.15" stroke="#f87171"/>
  <text x="520" y="238" text-anchor="middle" fill="#fee2e2" font-size="12" font-weight="bold">Redis</text>
  <text x="520" y="253" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 5 — State &amp; cache</text>

  <rect x="385" y="275" width="270" height="44" rx="6" fill="#34d399" opacity="0.15" stroke="#34d399"/>
  <text x="520" y="293" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="bold">PostgreSQL</text>
  <text x="520" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 6 — Operational memory (local)</text>

  <rect x="385" y="330" width="270" height="44" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24"/>
  <text x="520" y="348" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="bold">Evolution API</text>
  <text x="520" y="363" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 9 — WhatsApp channel</text>

  <text x="520" y="400" text-anchor="middle" fill="#64748b" font-size="10">All backend services for the agent gateway</text>
  <text x="520" y="416" text-anchor="middle" fill="#64748b" font-size="10">live on this VM, reachable by VM 1 over the network</text>

  <!-- Local / laptop box — optional -->
  <rect x="40" y="340" width="280" height="140" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="180" y="368" text-anchor="middle" fill="#fb923c" font-size="15" font-weight="bold">Laptop (optional)</text>
  <rect x="65" y="385" width="230" height="44" rx="6" fill="#fb923c" opacity="0.15" stroke="#fb923c"/>
  <text x="180" y="403" text-anchor="middle" fill="#ffedd5" font-size="12" font-weight="bold">Ollama (Llama 3.1 8B)</text>
  <text x="180" y="418" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 2 — Local model (optional, see docs/OLLAMA.md)</text>
  <text x="180" y="450" text-anchor="middle" fill="#64748b" font-size="10">Tunneled to VM 2 via Cloudflare · Also runs Promptfoo evals</text>

  <!-- Cloud services box -->
  <rect x="720" y="100" width="240" height="380" rx="10" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="840" y="128" text-anchor="middle" fill="#22d3ee" font-size="15" font-weight="bold">Cloud Services</text>
  <text x="840" y="146" text-anchor="middle" fill="#64748b" font-size="11">No server to manage</text>

  <rect x="745" y="165" width="190" height="44" rx="6" fill="#22d3ee" opacity="0.15" stroke="#22d3ee"/>
  <text x="840" y="183" text-anchor="middle" fill="#cffafe" font-size="12" font-weight="bold">Langfuse Cloud</text>
  <text x="840" y="198" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 7 — Observability</text>

  <rect x="745" y="220" width="190" height="44" rx="6" fill="#34d399" opacity="0.15" stroke="#34d399"/>
  <text x="840" y="238" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="bold">Supabase</text>
  <text x="840" y="253" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 6 — Conversations + vectors</text>

  <rect x="745" y="275" width="190" height="44" rx="6" fill="#fbbf24" opacity="0.15" stroke="#fbbf24"/>
  <text x="840" y="293" text-anchor="middle" fill="#fef3c7" font-size="12" font-weight="bold">Groq (Llama 3.1 8B)</text>
  <text x="840" y="308" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 2 — Default model · free tier · 249ms</text>

  <rect x="745" y="330" width="190" height="44" rx="6" fill="#94a3b8" opacity="0.15" stroke="#94a3b8"/>
  <text x="840" y="348" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">Claude Haiku · Gemini Flash</text>
  <text x="840" y="363" text-anchor="middle" fill="#94a3b8" font-size="9">Layer 2 — Cloud model fallbacks</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <line x1="320" y1="190" x2="360" y2="190" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="410" x2="385" y2="245" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="680" y1="190" x2="720" y2="190" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="297" x2="720" y2="297" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="340" x2="180" y2="305" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,3"/>

  <!-- Channels -->
  <rect x="40" y="540" width="920" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="500" y="566" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Layer 9 — Channels</text>
  <text x="500" y="588" text-anchor="middle" fill="#94a3b8" font-size="11">WhatsApp (Evolution API, VM 2) · Web Chat (n8n trigger, VM 1) · Voice (planned)</text>
  <text x="500" y="606" text-anchor="middle" fill="#64748b" font-size="10">All flowing through the same gateway and observability pipeline</text>

  <text x="500" y="655" text-anchor="middle" fill="#475569" font-size="11">Dashed lines = tunneled / cross-network connections · Dashed border = optional component</text>
  <text x="500" y="675" text-anchor="middle" fill="#475569" font-size="11">See DEPLOYMENT.md for full setup</text>
</svg>
